version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: time-slot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: timeslot_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - time-slot-network

  # NestJS Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: time-slot-app
    restart: unless-stopped
    ports:
      - '3500:3500'
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/timeslot_db
    depends_on:
      - postgres
    networks:
      - time-slot-network
    volumes:
      - ./prisma:/app/prisma
      - ./generated:/app/generated

  # Prisma Studio for database management
  prisma-studio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: time-slot-prisma-studio
    command: npx prisma studio --hostname 0.0.0.0 --port 5555
    ports:
      - '5555:5555'
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/timeslot_db
    depends_on:
      - postgres
    networks:
      - time-slot-network
    profiles:
      - tools

volumes:
  postgres_data:

networks:
  time-slot-network:
    driver: bridge
